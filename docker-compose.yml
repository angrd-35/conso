# Aucun port publié : conso n'est joignable que via Nginx Proxy Manager
# (réseau externe `proxy_net`), derrière le forward auth Authentik.
# Prérequis : le réseau `proxy_net` de NPM existe (docker network ls).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/conso.db"
      UPLOADS_DIR: "/app/data/uploads"
      AUTH_REQUIRED: "true"
      AUTH_REQUIRED_GROUP: "conso-users"
    volumes:
      - conso_data:/app/data
    networks:
      - internal # PAS sur `proxy` : seul le frontend peut l'atteindre

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      internal:
      proxy:
        aliases:
          - conso-frontend # NPM -> http://conso-frontend:80

networks:
  internal:
  proxy:
    external: true
    name: proxy_net # nom réel du réseau Docker de NPM

volumes:
  conso_data:
